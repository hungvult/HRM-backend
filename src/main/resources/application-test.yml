spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
app:
  attendance:
    company-timezone: ${COMPANY_TIMEZONE:Asia/Ho_Chi_Minh}
    # Mỗi CIDR phải là IP egress/gateway đáng tin cậy của Wi-Fi công ty,
    # không phải IP hoặc header do ứng dụng client gửi lên.
    trusted-sources: [ ]