spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
app:
  attendance:
    company-timezone: ${COMPANY_TIMEZONE:Asia/Ho_Chi_Minh}
    payroll:
      # Không có giá trị mặc định nghiệp vụ: 0 buộc L05 báo thiếu cấu hình thay vì tự đoán M.
      standard-minutes-per-day: ${PAYROLL_STANDARD_MINUTES_PER_DAY:0}
    max-gps-accuracy-meters: ${APP_ATTENDANCE_MAX_GPS_ACCURACY_METERS:50}
    max-location-age-seconds: ${APP_ATTENDANCE_MAX_LOCATION_AGE_SECONDS:60}
    max-future-location-seconds: ${APP_ATTENDANCE_MAX_FUTURE_LOCATION_SECONDS:15}
    # Mỗi CIDR phải là IP egress/gateway đáng tin cậy của Wi-Fi công ty,
    # không phải IP hoặc header do ứng dụng client gửi lên.
    trusted-sources:
      - cidr: 127.0.0.1/32
        wifi-network-id: 1
